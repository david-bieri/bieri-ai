<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 345">
  <title>Bieri · Claude Ecosystem Architecture</title>
  <desc>Four-domain, three-layer architecture: session-handover spans Research, Teaching, Admin, and Home domains. Each domain has a fast session notes file, a slow registry, and a skills layer. Teaching has seven active course: skills plus a meta skill-builder layer.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Calibri, 'Segoe UI', Arial, sans-serif; }
      .label-h { font-size: 14px; font-weight: 600; }
      .label-s { font-size: 11.5px; font-weight: 400; }
      .col-h   { font-size: 13px; font-weight: 600; fill: #2C2C2A; }
      .row-tag { font-size: 10.5px; font-weight: 400; fill: #888780; }
      .dim     { fill: #888780; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="345" fill="white"/>

  <!-- Legend -->
  <rect x="46" y="8" width="10" height="10" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="61" y="17" class="label-s" fill="#444441">universal</text>
  <rect x="130" y="8" width="10" height="10" rx="2" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
  <text x="145" y="17" class="label-s" fill="#444441">fast · volatile</text>
  <rect x="255" y="8" width="10" height="10" rx="2" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="270" y="17" class="label-s" fill="#444441">slow · stable</text>
  <rect x="365" y="8" width="10" height="10" rx="2" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="380" y="17" class="label-s" fill="#444441">skills</text>

  <!-- session-handover universal bar -->
  <rect x="40" y="28" width="600" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="49" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#0C447C">session-handover</text>
  <text x="340" y="67" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#185FA5">reads {PREFIX}_SESSION_NOTES.md at start · writes at end</text>

  <!-- Column separators -->
  <line x1="190" y1="85" x2="190" y2="308" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="340" y1="85" x2="340" y2="308" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
  <line x1="490" y1="85" x2="490" y2="308" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>

  <!-- Column headers -->
  <text x="115" y="97" text-anchor="middle" class="col-h">Research</text>
  <text x="265" y="97" text-anchor="middle" class="col-h">Teaching</text>
  <text x="415" y="97" text-anchor="middle" class="col-h">Admin</text>
  <text x="565" y="97" text-anchor="middle" class="col-h">Home</text>

  <!-- Row tags -->
  <text x="36" y="135" text-anchor="end" class="row-tag">fast</text>
  <text x="36" y="203" text-anchor="end" class="row-tag">slow</text>
  <text x="36" y="250" text-anchor="end" class="row-tag">skills</text>

  <!-- SESSION_NOTES row (amber) -->
  <rect x="46"  y="104" width="138" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="115" y="123" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#412402">RESEARCH_</text>
  <text x="115" y="141" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#633806">session_notes.md</text>

  <rect x="196" y="104" width="138" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="265" y="123" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#412402">TEACHING_</text>
  <text x="265" y="141" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#633806">session_notes.md</text>

  <rect x="346" y="104" width="138" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="123" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#412402">ADMIN_</text>
  <text x="415" y="141" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#633806">session_notes.md</text>

  <rect x="496" y="104" width="138" height="54" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="565" y="123" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#412402">HOME_</text>
  <text x="565" y="141" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#633806">session_notes.md</text>

  <!-- Promote / config label -->
  <text x="340" y="172" text-anchor="middle" class="dim">↑ promotes to registry · config flows ↓</text>

  <!-- Registry row (gray) -->
  <rect x="46"  y="179" width="138" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="115" y="196" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#2C2C2A">progress log</text>
  <text x="115" y="213" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#5F5E5A">(not yet)</text>

  <rect x="196" y="179" width="138" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="265" y="196" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#2C2C2A">skills registry</text>
  <text x="265" y="213" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#5F5E5A">SKILLS_MANIFEST.md</text>

  <rect x="346" y="179" width="138" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="415" y="196" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#2C2C2A">project progress</text>
  <text x="415" y="213" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#5F5E5A">+ decisions</text>

  <rect x="496" y="179" width="138" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="565" y="196" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#2C2C2A">registry</text>
  <text x="565" y="213" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#5F5E5A">(not yet)</text>

  <!-- Skills row -->
  <!-- Research — dashed inactive -->
  <rect x="46"  y="230" width="138" height="42" rx="6" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="115" y="253" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#888780">(none yet)</text>

  <!-- Teaching — active purple -->
  <rect x="196" y="230" width="138" height="42" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="265" y="246" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#26215C">course:*</text>
  <text x="265" y="262" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#3C3489">7 skills active</text>

  <!-- Admin — dashed, project-specific -->
  <rect x="346" y="230" width="138" height="42" rx="6" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="415" y="246" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#5F5E5A">(project-specific)</text>

  <!-- Home — dashed inactive -->
  <rect x="496" y="230" width="138" height="42" rx="6" fill="#F8F8F6" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="565" y="253" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#888780">(none yet)</text>

  <!-- Meta layer -->
  <rect x="196" y="282" width="138" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="265" y="296" text-anchor="middle" dominant-baseline="central" class="label-h" fill="#26215C">skill-builder</text>
  <text x="265" y="312" text-anchor="middle" dominant-baseline="central" class="label-s" fill="#3C3489">audit_skill.py</text>
  <text x="348" y="305" class="dim">meta · governs skills library</text>

</svg>
